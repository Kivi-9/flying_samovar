<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-label="Самовар-аэростат «Пар-Облако»" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f7"/>
      <stop offset="1" stop-color="#f6efe0"/>
    </linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0392b"/>
      <stop offset="0.5" stop-color="#e8644f"/>
      <stop offset="1" stop-color="#a93226"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6a1c"/>
      <stop offset="0.45" stop-color="#e6bd54"/>
      <stop offset="1" stop-color="#8a5c14"/>
    </linearGradient>
  </defs>

  <rect width="640" height="460" fill="url(#sky)"/>

  <!-- облака -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="100" cy="90" rx="55" ry="18"/>
    <ellipse cx="135" cy="80" rx="35" ry="16"/>
    <ellipse cx="540" cy="130" rx="60" ry="18"/>
    <ellipse cx="510" cy="120" rx="32" ry="15"/>
    <ellipse cx="560" cy="380" rx="50" ry="14"/>
    <ellipse cx="90" cy="350" rx="48" ry="14"/>
  </g>

  <!-- баллон: конструкционный элемент (подъёмная сила) -->
  <path d="M320 30 C 200 30, 160 130, 190 210 C 205 250, 250 275, 290 285 L 350 285 C 390 275, 435 250, 450 210 C 480 130, 440 30, 320 30 Z"
        fill="url(#env)" stroke="#7b241c" stroke-width="3"/>
  <path d="M320 30 C 290 90, 285 200, 300 285" fill="none" stroke="#7b241c" stroke-width="2" opacity="0.6"/>
  <path d="M320 30 C 350 90, 355 200, 340 285" fill="none" stroke="#7b241c" stroke-width="2" opacity="0.6"/>
  <path d="M235 70 C 215 110, 212 160, 225 205" fill="none" stroke="#f5b7a8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <text x="320" y="170" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff3e0" text-anchor="middle">ПАР-ОБЛАКО</text>
  <text x="320" y="196" font-family="sans-serif" font-size="13" fill="#fff3e0" text-anchor="middle">envelope_volume_m3</text>

  <!-- растяжки -->
  <g stroke="#5d4037" stroke-width="2">
    <line x1="292" y1="285" x2="285" y2="335"/>
    <line x1="348" y1="285" x2="355" y2="335"/>
    <line x1="320" y1="285" x2="320" y2="335"/>
  </g>

  <!-- пар из трубы -->
  <g fill="#ffffff" opacity="0.9" stroke="#b0bec5" stroke-width="1">
    <circle cx="320" cy="300" r="9"/>
    <circle cx="326" cy="289" r="6"/>
  </g>

  <!-- самовар -->
  <g>
    <!-- труба -->
    <rect x="312" y="318" width="16" height="22" fill="url(#brass)" stroke="#6d4c11" stroke-width="2"/>
    <!-- крышка -->
    <ellipse cx="320" cy="342" rx="34" ry="8" fill="url(#brass)" stroke="#6d4c11" stroke-width="2"/>
    <!-- корпус -->
    <path d="M286 344 C 270 372, 276 410, 300 422 L 340 422 C 364 410, 370 372, 354 344 Z"
          fill="url(#brass)" stroke="#6d4c11" stroke-width="3"/>
    <!-- ручки -->
    <path d="M286 352 C 268 352, 266 372, 281 374" fill="none" stroke="#6d4c11" stroke-width="5" stroke-linecap="round"/>
    <path d="M354 352 C 372 352, 374 372, 359 374" fill="none" stroke="#6d4c11" stroke-width="5" stroke-linecap="round"/>
    <!-- кран -->
    <rect x="360" y="388" width="22" height="7" rx="3" fill="#6d4c11"/>
    <circle cx="386" cy="391" r="5" fill="#8a5c14"/>
    <!-- горелка -->
    <rect x="304" y="422" width="32" height="10" rx="3" fill="#455a64"/>
    <path d="M312 436 C 316 450, 324 450, 328 436 C 324 442, 316 442, 312 436 Z" fill="#ff9800"/>
  </g>

  <!-- пилот-чаевод -->
  <g>
    <circle cx="320" cy="378" r="11" fill="#ffcc80" stroke="#6d4c11" stroke-width="2"/>
    <path d="M309 372 L 331 372 L 320 360 Z" fill="#37474f"/>
  </g>

  <!-- подписи -->
  <g font-family="sans-serif" font-size="13" fill="#37474f">
    <text x="30" y="250">баллон (подъёмная сила)</text>
    <line x1="150" y1="246" x2="215" y2="230" stroke="#37474f" stroke-width="1.5"/>
    <text x="420" y="330">горелка-самовар</text>
    <line x1="420" y1="335" x2="345" y2="425" stroke="#37474f" stroke-width="1.5"/>
  </g>
</svg>
